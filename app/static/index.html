<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phi-2 Playground</title>
<style>
  :root {
    --bg: #fafafa; --fg: #1a1a1a; --muted: #666; --border: #d4d4d4;
    --panel: #fff; --accent: #2563eb; --error: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141414; --fg: #e8e8e8; --muted: #999; --border: #3a3a3a;
      --panel: #1e1e1e; --accent: #3b82f6; --error: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.5 system-ui, -apple-system, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: 0.9rem; }
  textarea, pre {
    width: 100%; background: var(--panel); color: var(--fg);
    border: 1px solid var(--border); border-radius: 8px; padding: 12px;
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  textarea { min-height: 120px; resize: vertical; }
  .row { display: flex; gap: 12px; align-items: center; margin: 12px 0 24px; flex-wrap: wrap; }
  label { color: var(--muted); font-size: 0.9rem; }
  input[type=number] {
    width: 80px; padding: 6px 8px; background: var(--panel); color: var(--fg);
    border: 1px solid var(--border); border-radius: 6px;
  }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 6px;
    padding: 8px 18px; font-size: 0.95rem; cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: wait; }
  #status { color: var(--muted); font-size: 0.9rem; }
  #status.error { color: var(--error); }
  pre { white-space: pre-wrap; word-wrap: break-word; min-height: 60px; margin: 0; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Phi-2 Playground</h1>
  <p class="sub">Type a prompt and the model will continue it. For the raw API, see <a href="/docs">/docs</a>.</p>

  <textarea id="prompt" placeholder="e.g. def fibonacci(n):"></textarea>
  <div class="row">
    <button id="go">Generate</button>
    <label>Max tokens <input id="max" type="number" min="1" max="1024" value="256"></label>
    <span id="status"></span>
  </div>

  <pre id="output"></pre>
</main>
<script>
  const $ = (id) => document.getElementById(id);

  async function run() {
    const prompt = $("prompt").value;
    if (!prompt.trim()) { setStatus("Enter a prompt first.", true); return; }
    $("go").disabled = true;
    $("output").textContent = "";
    setStatus("Generating…");
    const start = performance.now();
    try {
      const r = await fetch("/generate/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt, max_tokens: Number($("max").value) }),
      });
      if (!r.ok) throw new Error(errorMessage(r.status, await r.json().catch(() => null)));
      const reader = r.body.pipeThrough(new TextDecoderStream()).getReader();
      let buffer = "", text = "";
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        const lines = (buffer + value).split("\n");
        buffer = lines.pop();
        for (const line of lines) if (line) text += JSON.parse(line);
        $("output").textContent = text.replace(/^\s*\n/, "");
      }
      setStatus(`Done in ${((performance.now() - start) / 1000).toFixed(1)}s`);
    } catch (e) {
      setStatus(e.message, true);
    } finally {
      $("go").disabled = false;
    }
  }

  function errorMessage(status, data) {
    if (status === 503) return "The model is still loading. Try again in a moment.";
    if (status === 422) return "Max tokens must be between 1 and 1024.";
    return (data && data.detail) || `Request failed (${status}).`;
  }

  function setStatus(text, isError = false) {
    $("status").textContent = text;
    $("status").className = isError ? "error" : "";
  }

  $("go").addEventListener("click", run);
  $("prompt").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) run();
  });
</script>
</body>
</html>
